<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fbf9f7">
    <meta name="description" content="Мини-загадка с маленьким сюрпризом.">
    <title>Для тебя</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48'%3E%E2%99%A1%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css?v=owl-20260923-3">
  </head>
  <body>
    <main class="shell">
      <div class="animated-owl" aria-hidden="true">
        <svg viewBox="0 0 96 96" role="presentation">
          <defs>
            <linearGradient id="owl-feathers" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#bd896f"/>
              <stop offset="1" stop-color="#79515a"/>
            </linearGradient>
            <linearGradient id="owl-wings" x1="0" y1="0" x2="0.9" y2="1">
              <stop offset="0" stop-color="#d2a084"/>
              <stop offset="1" stop-color="#91616a"/>
            </linearGradient>
            <radialGradient id="owl-eyes" cx="35%" cy="30%">
              <stop offset="0" stop-color="#f7c779"/>
              <stop offset="1" stop-color="#c47748"/>
            </radialGradient>
          </defs>

          <ellipse cx="48" cy="89" rx="25" ry="4" fill="#604b49" opacity=".12"/>

          <g class="owl-wing owl-wing-left">
            <path d="M31 47c-10-4-20 1-23 12-3 9 3 21 12 26 6 3 13-2 17-10z" fill="url(#owl-wings)"/>
            <path d="M14 58c7 1 13 6 17 13m-19-3c6 1 11 5 15 10" fill="none" stroke="#f0c6a9" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
          </g>
          <g class="owl-wing owl-wing-right">
            <path d="M65 47c10-4 20 1 23 12 3 9-3 21-12 26-6 3-13-2-17-10z" fill="url(#owl-wings)"/>
            <path d="M82 58c-7 1-13 6-17 13m19-3c-6 1-11 5-15 10" fill="none" stroke="#f0c6a9" stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
          </g>

          <path d="M39 73h6v11c0 3-2 5-5 5h-8c-2 0-3-2-1-3l8-5zm18 0h-6v11c0 3 2 5 5 5h8c2 0 3-2 1-3l-8-5z" fill="#a76069"/>
          <path d="M28 48c-9 8-10 21-5 31 5 9 14 13 25 13s20-4 25-13c5-10 4-23-5-31z" fill="url(#owl-feathers)"/>
          <path d="M33 57c4-5 9-7 15-7s11 2 15 7c4 6 4 15 0 22-3 6-8 9-15 9s-12-3-15-9c-4-7-4-16 0-22z" fill="#f1dfca"/>
          <path d="M38 66c3 2 6 3 10 3s7-1 10-3m-20 8c3 2 6 3 10 3s7-1 10-3m-17 8c2 1 4 2 7 2s5-1 7-2" fill="none" stroke="#cfaa91" stroke-width="1.8" stroke-linecap="round" opacity=".76"/>
          <path d="M39 87c-2 2-5 3-9 3m27-3c2 2 5 3 9 3" fill="none" stroke="#e5ad6a" stroke-width="3" stroke-linecap="round"/>

          <g class="owl-head">
            <path d="M24 35c-5-5-9-13-10-21 9 3 17 8 21 15m37 6c5-5 9-13 10-21-9 3-17 8-21 15" fill="#875a5a"/>
            <path d="M20 38c0-18 12-29 28-29s28 11 28 29c0 14-11 23-28 23S20 52 20 38z" fill="url(#owl-feathers)"/>
            <path d="M24 39c2-10 9-16 18-16 5 0 8 2 11 5 3-3 6-5 11-5 9 0 16 6 18 16-2 11-13 18-29 18S26 50 24 39z" fill="#f1dfca"/>
            <path d="M30 27c-4 1-7 3-9 6m45-6c4 1 7 3 9 6" fill="none" stroke="#d5ad94" stroke-width="2" stroke-linecap="round"/>
            <ellipse cx="35" cy="38" rx="8" ry="9.5" fill="url(#owl-eyes)"/>
            <ellipse cx="61" cy="38" rx="8" ry="9.5" fill="url(#owl-eyes)"/>
            <ellipse cx="36" cy="39" rx="4" ry="6" fill="#342b32"/>
            <ellipse cx="60" cy="39" rx="4" ry="6" fill="#342b32"/>
            <circle cx="34.5" cy="36.5" r="1.7" fill="#fff8e9"/>
            <circle cx="58.5" cy="36.5" r="1.7" fill="#fff8e9"/>
            <path d="M44 43l4-4 4 4-4 6z" fill="#e7a15e"/>
            <path d="M23 45c3 2 6 3 9 3m32 0c3 0 6-1 9-3" fill="none" stroke="#d88a87" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
            <g class="owl-blink">
              <path d="M26 38q9 7 18 0v5q-9 6-18 0zm26 0q9 7 18 0v5q-9 6-18 0z" fill="#a86f62"/>
            </g>
          </g>
        </svg>
      </div>

      <section class="panel panel-preview" id="preview-panel" aria-labelledby="preview-title">
        <div class="screen-head">
          <p class="overline" id="preview-overline"></p>
          <div class="ornament" aria-hidden="true">
            <span></span>
            <i>♡</i>
            <span></span>
          </div>
        </div>

        <div class="preview-content">
          <figure class="preview-art">
            <img id="preview-image" alt="">
          </figure>

          <h1 id="preview-title"></h1>

          <div class="tiny-ornament" aria-hidden="true">
            <span></span>
            <i>♡</i>
            <span></span>
          </div>

          <p id="preview-text"></p>
          <div class="preview-heart" aria-hidden="true">♡</div>
          <button class="start-button" type="button" id="start-button"></button>
        </div>

        <div class="pixel-cat" aria-hidden="true"></div>
      </section>

      <section class="panel panel-riddle" id="riddle-panel" aria-labelledby="page-title" hidden>
        <div class="screen-head">
          <p class="overline" id="site-overline"></p>
          <div class="ornament" aria-hidden="true">
            <span></span>
            <i>♡</i>
            <span></span>
          </div>
          <div class="progress-line" id="progress-line" aria-hidden="true">
          </div>
        </div>

        <div class="intro">
          <div class="hero-heart" aria-hidden="true">♡</div>
          <h1 id="page-title"></h1>
          <p class="riddle-text" id="riddle-text"></p>
          <div class="tiny-ornament" aria-hidden="true">
            <span></span>
            <i>♡</i>
            <span></span>
          </div>
        </div>

        <form class="answer-form" id="answer-form" autocomplete="off">
          <label for="answer-input" id="answer-label"></label>
          <div class="input-row">
            <div class="answer-field">
              <span aria-hidden="true">♡</span>
              <input
                id="answer-input"
                name="answer"
                type="text"
                inputmode="text"
                enterkeyhint="done"
                spellcheck="false"
                aria-describedby="answer-message"
              >
            </div>
            <button type="submit" id="submit-button"></button>
          </div>
          <p class="message" id="answer-message" role="status" aria-live="polite"></p>
        </form>

        <div class="pixel-cat" aria-hidden="true"></div>
      </section>

      <section class="panel panel-success" id="success-panel" aria-labelledby="success-title" hidden>
        <div class="screen-head">
          <p class="overline" id="success-overline"></p>
          <div class="ornament" aria-hidden="true">
            <span></span>
            <i>♡</i>
            <span></span>
          </div>
        </div>

        <div class="success-copy">
          <div class="hero-heart hero-heart-large" aria-hidden="true">♡</div>
          <h2 id="success-title"></h2>
          <p id="success-text"></p>
          <p class="success-note" id="success-note"></p>
        </div>

        <div class="photo-stack">
          <figure class="photo-frame">
            <img id="gift-photo" alt="">
            <figcaption id="gift-caption"></figcaption>
          </figure>

          <figure class="photo-frame">
            <img id="secret-photo" alt="">
            <figcaption id="photo-caption"></figcaption>
          </figure>
        </div>

        <p class="closing" id="closing-text"></p>
        <div class="love-prompt">
          <p>Нажми на кнопку</p>
          <span aria-hidden="true">👇</span>
        </div>
        <button class="love-button" type="button" id="love-button">Люблю тебя</button>
        <div class="pixel-cat" aria-hidden="true"></div>
      </section>

      <section class="panel panel-final" id="final-panel" aria-labelledby="final-title" hidden>
        <div class="screen-head">
          <p class="overline">Для тебя</p>
          <div class="ornament" aria-hidden="true">
            <span></span>
            <i>♡</i>
            <span></span>
          </div>
        </div>

        <div class="final-content">
          <div class="pocket-illustration" aria-hidden="true">
            <span class="pocket-heart">♥</span>
            <div class="pocket-shape"><span></span></div>
          </div>
          <p class="final-overline">Ещё одна маленькая подсказка</p>
          <h1 id="final-title">Загляни ещё в кармашек! 💗</h1>
          <p class="final-note">Там тебя ждёт сладкое угощение и идея для нашего нового уютного свидания дома. Место ты уже видела на фото.</p>
          <button class="back-button" type="button" id="back-to-photos">Вернуться к фото</button>
        </div>

        <div class="pixel-cat" aria-hidden="true"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
